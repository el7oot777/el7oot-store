<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL7OOT Menswear</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#111;
color:#fff;
}

header{
background:#000;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:28px;
font-weight:bold;
color:#f5c542;
}

.back{
color:white;
text-decoration:none;
font-size:16px;
}

.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
padding:12px;
}

.card{
background:#171717;
border-radius:15px;
overflow:hidden;
box-shadow:0 0 18px rgba(245,197,66,.12);
display:flex;
flex-direction:column;
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.info{
padding:15px;
display:flex;
flex-direction:column;
flex:1;
}

.title{
font-size:15px;
font-weight:700;
line-height:1.5;
margin-bottom:10px;
}

.price{
color:#f5c542;
font-size:20px;
font-weight:bold;
margin-bottom:10px;
}

.size{
color:#ccc;
margin-bottom:15px;
}

.btn{
margin-top:auto;
display:block;
width:100%;
padding:12px;
background:linear-gradient(135deg,#f5c542,#ffbf00);
color:#111;
text-decoration:none;
text-align:center;
font-weight:800;
border-radius:12px;
}

.section-title{
text-align:center;
padding:25px 15px;
font-size:28px;
font-weight:bold;
}

</style>
</head>
<body>

<header>

<a href="index.html" class="back">
⬅ رجوع
</a>

<div class="logo">
EL7OOT
</div>

<div style="position:relative">

<a href="cart.html" style="
text-decoration:none;
font-size:28px;
">
🛒
</a>

<span id="cart-count" style="
position:absolute;
top:-8px;
right:-10px;
background:red;
color:white;
width:20px;
height:20px;
border-radius:50%;
font-size:12px;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
">
0
</span>

</div>

</header>

<div class="section-title" id="categoryTitle">
القسم
</div>

<section class="products" id="products"></section>

<script>

const params =
new URLSearchParams(window.location.search);

const currentCategory =
params.get("cat");

document.getElementById("categoryTitle")
.innerText = currentCategory;

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSL4chzLtjr_560-y7wFCv6AKlJN7WsaXmH-q3t-Yi8r9aLHtCTZ7wgv5SbBJst7opkvhjEEUs36JtU/pub?output=csv";

fetch(SHEET_URL)
.then(res=>res.text())
.then(data=>{

const rows =
data.trim().split("\n").slice(1);

const container =
document.getElementById("products");

rows.forEach(row=>{

const cols =
row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);

if(!cols) return;

for(let i=0;i<cols.length;i++){
cols[i] =
cols[i].replace(/^"|"$/g,'');
}

if(cols[4] !== currentCategory)
return;

container.innerHTML += `

<div class="card">

<img src="${cols[3]}">

<div class="info">

<div class="title">
${cols[0]}
</div>

<div class="price">
${cols[1]} ج.م
</div>

<div class="size">
${cols[2]}
</div>


<div style="display:flex;gap:8px;margin-top:10px">

<a class="btn"
href="order.html?product=${cols[0]}&price=${cols[1]}"
style="flex:1">
اطلب الآن
</a>

<button
onclick="addToCart('${cols[0]}','${cols[1]}','${cols[3]}')"
style="
flex:1;
background:#222;
color:#f5c542;
border:1px solid #f5c542;
border-radius:12px;
font-weight:bold;
cursor:pointer;
">
🛒 للسلة
</button>

</div>
</div>

</div>

</div>

`;

});

});

</script>
<script>

function addToCart(name,price,image){

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

let existing =
cart.find(item => item.name === name);

if(existing){

existing.qty += 1;

}else{

cart.push({
name:name,
price:price,
image:image,
qty:1
});

}

localStorage.setItem(
"cart",
JSON.stringify(cart)
);
updateCartCount();
alert("تمت الإضافة للسلة");

}

</script>
  <script>

function updateCartCount(){

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

let count = 0;

cart.forEach(item=>{

count += Number(item.qty || 1);

});

document.getElementById("cart-count")
.innerText = count;

}

updateCartCount();

</script>
</body>
</html>
