<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL7OOT Menswear</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#111;
color:white;
}

header{
background:#000;
padding:20px;
display:flex;
justify-content:center;
align-items:center;
}

.logo{
font-size:30px;
font-weight:bold;
color:#f5c542;
}

.hero{
padding:30px;
text-align:center;
}

.hero h1{
font-size:38px;
margin-bottom:10px;
}

.hero p{
color:#ccc;
}

.categories{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
padding:14px;
}

.card{
background:#171717;
border-radius:18px;
overflow:hidden;
text-decoration:none;
color:white;
box-shadow:0 0 20px rgba(245,197,66,.12);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card-title{
padding:16px;
text-align:center;
font-size:18px;
font-weight:800;
}

</style>
</head>
<body>

<header>
<div class="logo">EL7OOT</div>
</header>

<section class="hero">
<h1>الأقسام</h1>
<p>اختر القسم الذي تريد تصفحه</p>
</section>

<section class="categories" id="categories"></section>

<script>

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSL4chzLtjr_560-y7wFCv6AKlJN7WsaXmH-q3t-Yi8r9aLHtCTZ7wgv5SbBJst7opkvhjEEUs36JtU/pub?output=csv";

fetch(SHEET_URL)
.then(res => res.text())
.then(data => {

const rows =
data.trim().split("\n").slice(1);

const categoriesContainer =
document.getElementById("categories");

const categories = {};

rows.forEach(row=>{

const cols =
row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);

if(!cols) return;

for(let i=0;i<cols.length;i++){
cols[i]=cols[i].replace(/^"|"$/g,'');
}

const image = cols[3];
const category = cols[4];

if(!categories[category]){

categories[category] = image;

}

});

Object.keys(categories).forEach(cat=>{

categoriesContainer.innerHTML += `

<a class="card"
href="category.html?cat=${encodeURIComponent(cat)}">

<img src="${categories[cat]}">

<div class="card-title">
${cat}
</div>

</a>

`;

});

});

</script>

</body>
</html>
