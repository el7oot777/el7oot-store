<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL7OOT Menswear</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#111;
color:#fff;
}

header{
background:#000;
padding:20px;
text-align:center;
font-size:32px;
font-weight:bold;
color:#f5c542;
}

.hero{
padding:30px;
text-align:center;
}

.hero h1{
margin-bottom:10px;
}

.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
padding:12px;
}
.card{
background:#171717;
border-radius:15px;
overflow:hidden;
box-shadow:0 0 18px rgba(245,197,66,.12);

display:flex;
flex-direction:column;
height:100%;
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.info{
padding:15px;
display:flex;
flex-direction:column;
flex:1;
}

.title{
font-size:15px;
font-weight:700;
min-height:48px;
line-height:1.5;
}

.price{
color:#f5c542;
font-size:18px;
font-weight:bold;
margin-bottom:10px;
}

.size{
margin-bottom:15px;
color:#bdbdbd;
min-height:30px;
}

.btn{
margin-top:auto;
display:block;
width:100%;
padding:12px;
background:linear-gradient(135deg,#f5c542,#ffbf00);
color:#111;
text-decoration:none;
text-align:center;
font-weight:800;
border-radius:12px;
box-shadow:0 8px 20px rgba(245,197,66,.2);
}

footer{
background:#000;
text-align:center;
padding:20px;
margin-top:20px;
}
.card{
transition:.3s;
}

.card:hover{
transform:translateY(-3px);
}
</style>

</head>
<body>

<header style="
display:flex;
justify-content:space-between;
align-items:center;
padding:20px;
">

<div style="
font-size:28px;
font-weight:bold;
color:#f5c542;
">
EL7OOT
</div>

<div style="
font-size:30px;
cursor:pointer;
">
🛒
</div>

</header>
<section class="hero">
<h1>أحدث الملابس الرجالي</h1>
<p>جودة عالية وأسعار مميزة</p>
</section>

<section class="products" id="products">


<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSL4chzLtjr_560-y7wFCv6AKlJN7WsaXmH-q3t-Yi8r9aLHtCTZ7wgv5SbBJst7opkvhjEEUs36JtU/pub?output=csv";

fetch(SHEET_URL)
.then(res => res.text())
.then(data => {
  const rows = data.trim().split("\n").slice(1);
  const container = document.getElementById("products");

  rows.forEach(row => {
    const cols = row.split(",");

    container.innerHTML += `
      <div class="card">
        <a href="${cols[3]}" target="_blank">
  <img src="${cols[3]}">
</a>
        <div class="info">
          <div class="title">${cols[0]}</div>
          <div class="price">${cols[1]} ج.م</div>
          <div class="size">${cols[2]}</div>
          <div style="display:flex;gap:8px;margin-top:10px">

<a class="btn"
href="order.html?product=${cols[0]}&price=${cols[1]}"
style="flex:1">
اطلب الآن
</a>

<button
onclick="addToCart('${cols[0]}','${cols[1]}','${cols[3]}')"
style="
flex:1;
background:#222;
color:#f5c542;
border:1px solid #f5c542;
border-radius:12px;
font-weight:bold;
cursor:pointer;
">
🛒 للسلة
</button>

</div>
        </div>
      </div>
    `;
  });
});
</script>

</section>

<footer>
EL7OOT Menswear © 2026
</footer>
<script>
function addToCart(name,price,image){

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

cart.push({
name:name,
price:price,
image:image,
qty:1
});

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

alert("تمت الإضافة للسلة");
}
</script>
</body>
</html>
