<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>السلة - EL7OOT</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#111;
color:#fff;
}

header{
background:#000;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
color:#f5c542;
}

.container{
padding:15px;
}

.cart-item{
background:#171717;
border-radius:18px;
padding:12px;
margin-bottom:15px;
display:flex;
gap:12px;
align-items:center;
box-shadow:0 0 18px rgba(245,197,66,.08);
}

.cart-item img{
width:90px;
height:90px;
object-fit:cover;
border-radius:12px;
}

.info{
flex:1;
}

.name{
font-weight:700;
margin-bottom:5px;
}

.price{
color:#f5c542;
font-size:18px;
font-weight:bold;
}

.remove{
background:#ff3b30;
color:#fff;
border:none;
padding:8px 12px;
border-radius:10px;
cursor:pointer;
}

.total{
background:#171717;
padding:20px;
border-radius:18px;
margin-top:20px;
text-align:center;
}

.total h2{
color:#f5c542;
margin-bottom:10px;
}

.checkout{
display:block;
width:100%;
margin-top:15px;
padding:15px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#f5c542,#ffbf00);
font-weight:800;
font-size:18px;
cursor:pointer;
}

.empty{
text-align:center;
padding:50px 20px;
color:#999;
font-size:20px;
}

</style>
</head>
<body>

<header>
🛒 سلة المشتريات
</header>

<div class="container" id="cartContainer"></div>

<script>

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

const container =
document.getElementById("cartContainer");

function renderCart(){

if(cart.length===0){

container.innerHTML=
'<div class="empty">السلة فارغة</div>';

return;
}

let total=0;

container.innerHTML='';

cart.forEach((item,index)=>{

total+=Number(item.price);

container.innerHTML+=`

<div class="cart-item">

<img src="${item.image}">

<div class="info">
<div class="name">${item.name}</div>
<div class="price">${item.price} ج.م</div>
</div>

<button
class="remove"
onclick="removeItem(${index})">
حذف
</button>

</div>

`;

});

container.innerHTML+=`

<div class="total">

<h2>
الإجمالي: ${total} ج.م
</h2>

<button
class="checkout"
onclick="checkout()">

إتمام الطلب

</button>

</div>

`;

}

function removeItem(index){

cart.splice(index,1);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

renderCart();

}

function checkout(){

localStorage.setItem(
"checkoutCart",
JSON.stringify(cart)
);

window.location.href="order.html";

}

renderCart();

</script>

</body>
</html>
