<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta name="format-detection" content="telephone=no">
<title>إتمام الطلب - EL7OOT</title>
 <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{
background:#0b0b0b;
font-family:'Cairo',sans-serif;
color:#fff;
padding:20px;
margin:0;
}
.container{
max-width:700px;
margin:auto;
}
.card{
background:#171717;
padding:25px;
border-radius:24px;
margin-bottom:20px;
border:1px solid rgba(255,255,255,.05);
box-shadow:0 10px 30px rgba(0,0,0,.4);
}
h1,h2{
text-align:center;
color:#f5c542;
font-weight:800;
letter-spacing:.5px;
}
input,select,textarea{
width:100%;
padding:14px;
margin-top:10px;
margin-bottom:15px;
background:#121212;
border:1px solid #2e2e2e;
border-radius:10px;
color:white;
font-size:16px;
box-sizing:border-box;
}
.summary{
line-height:2;
font-size:18px;
}
.total{
font-size:28px;
font-weight:bold;
color:#f5c542;
text-shadow:0 0 5px rgba(245,197,66,.25);
}

button{
width:100%;
padding:16px;
background:linear-gradient(135deg,#f5c542,#ffbf00);
color:#111;
box-shadow:0 0 25px rgba(245,197,66,.4);
border:none;
border-radius:14px;
font-size:22px;
font-weight:bold;
cursor:pointer;
}
.pay-box{
background:#111;
border:1px solid rgba(245,197,66,.35);
border-radius:20px;
padding:20px;
text-align:center;
margin-bottom:25px;
}
.pay-number{
color:#f5c542;
font-size:28px;
font-weight:800;
margin:10px 0;
text-shadow:none;
}
 input:focus,
select:focus,
textarea:focus{
outline:none;
border:1px solid #f5c542;
box-shadow:0 0 10px rgba(245,197,66,.2);
}
.pay-number{
color:#f5c542 !important;
font-size:32px;
font-weight:800;
margin:15px 0;
text-decoration:none !important;
}
</style>
</head>
<body>
<div class="container">
<div class="card">
<h1>إتمام الطلب</h1>
</div>
<div class="card">
<h2>بيانات العميل</h2>
<input id="name" placeholder="الاسم بالكامل">
<input id="phone" placeholder="رقم الهاتف">
<select id="gov" onchange="updatePrice()">
<option value="">اختر المحافظة</option>
<option>القاهرة</option>
<option>الجيزة</option>
<option>الإسكندرية</option>
<option>الغربية</option>
<option>الدقهلية</option>
<option>الشرقية</option>
<option>المنوفية</option>
<option>القليوبية</option>
<option>كفر الشيخ</option>
<option>البحيرة</option>
<option>دمياط</option>
<option>بورسعيد</option>
<option>الإسماعيلية</option>
<option>السويس</option>
<option>الفيوم</option>
<option>بني سويف</option>
<option>المنيا</option>
<option>أسيوط</option>
<option>سوهاج</option>
<option>قنا</option>
<option>الأقصر</option>
<option>أسوان</option>
<option>الوادي الجديد</option>
<option>البحر الأحمر</option>
<option>مطروح</option>
<option>شمال سيناء</option>
<option>جنوب سيناء</option>
</select>
  <select id="size">
<option value="">اختر المقاس</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>2XL</option>
<option>3XL</option>
</select>
<textarea id="address" placeholder="العنوان بالكامل"></textarea>
</div>
<div class="card">
<h2>ملخص الطلب</h2>

<div class="summary">

📦 المنتج:
<span id="product"></span>

<br><br>

💰 السعر:
<span id="price"></span> ج.م

<br><br>

🚚 الشحن:
<span id="shipping">0</span> ج.م

<br><br>

<div class="total">
💵 الإجمالي:
<span id="total">0</span> ج.م
</div>

</div>
</div>
<div class="pay-box">

⚠️ لإتمام الطلب يجب تحويل المبلغ أولاً

<br><br>

💳 فودافون كاش / InstaPay

<br>

<div class="pay-number" style="
color:#f5c542;
font-size:32px;
font-weight:800;
text-decoration:none;
">
01002685845
</div>
<br>

📸 بعد التحويل اضغط على "تأكيد الطلب"

<br>
وأرسل سكرين شوت التحويل على واتساب.
</div>
<button onclick="sendOrder()">
تأكيد الطلب
</button>
</div>
<script>
const params=new URLSearchParams(window.location.search);

let product=params.get("product") || "";
let price=parseInt(params.get("price")) || 0;

const checkoutCart =
JSON.parse(localStorage.getItem("checkoutCart")) || [];

if(checkoutCart.length){

product = checkoutCart
.map(item => item.name)
.join(" + ");

price = checkoutCart
.reduce((sum,item)=>sum+Number(item.price),0);

}

document.getElementById("product").innerText=product;
document.getElementById("price").innerText=price;
document.getElementById("total").innerText=price;
function updatePrice(){
const delta=[
"القاهرة","الجيزة","الإسكندرية",
"الغربية","الدقهلية","الشرقية",
"المنوفية","القليوبية","كفر الشيخ",
"البحيرة","دمياط","بورسعيد",
"الإسماعيلية","السويس"
];
const gov=document.getElementById("gov").value;
let shipping=150;
if(delta.includes(gov)){
shipping=130;
}
document.getElementById("shipping").innerText=shipping;
document.getElementById("total").innerText=price+shipping;
}
function sendOrder(){

const name=document.getElementById("name").value;
const phone=document.getElementById("phone").value;
const gov=document.getElementById("gov").value;
const size=document.getElementById("size").value;
const address=document.getElementById("address").value;
const shipping=document.getElementById("shipping").innerText;
const total=document.getElementById("total").innerText;

const text=`🖤 طلب جديد من EL7OOT 🖤

👕 المنتج: ${product}

💵 السعر: ${price} ج.م

🚚 الشحن: ${shipping} ج.م

💰 الإجمالي: ${total} ج.م

👤 الاسم: ${name}

📞 الموبايل: ${phone}

📍 المحافظة: ${gov}

📏 المقاس: ${size}

🏡 العنوان: ${address}

💳 يرجى تحويل المبلغ إلى:

01002685845

(فودافون كاش أو InstaPay)

📸 ثم إرسال سكرين شوت التحويل

📱 ورقم الهاتف الذي تم التحويل منه

✅ لتأكيد الطلب وتجهيزه للشحن`;

window.open(
`https://wa.me/201033950845?text=${encodeURIComponent(text)}`,
"_blank"
);

}
</script>
</body>
</html>
