📦 المنتج:

<br><br>

</div>

background:#2a1d00;
border:1px solid #f5c542;

تأكيد الطلب

<script>
const params=new URLSearchParams(window.location.search);
const product=params.get("product") || "";
const price=parseInt(params.get("price")) || 0;
document.getElementById("product").innerText=product;
document.getElementById("price").innerText=price;
document.getElementById("total").innerText=price;
function updatePrice(){
const delta=[
"القاهرة","الجيزة","الإسكندرية",
"الغربية","الدقهلية","الشرقية",
"المنوفية","القليوبية","كفر الشيخ",
"البحيرة","دمياط","بورسعيد",
"الإسماعيلية","السويس"
];
const gov=document.getElementById("gov").value;
let shipping=150;
if(delta.includes(gov)){
shipping=130;
}
document.getElementById("shipping").innerText=shipping;
document.getElementById("total").innerText=price+shipping;
}
<script>
function sendOrder(){

const name=document.getElementById("name").value;
const phone=document.getElementById("phone").value;
const gov=document.getElementById("gov").value;
const address=document.getElementById("address").value;
const shipping=document.getElementById("shipping").innerText;
const total=document.getElementById("total").innerText;

const text=`🖤 طلب جديد من EL7OOT 🖤

👕 المنتج: ${product}

💵 السعر: ${price} ج.م

🚚 الشحن: ${shipping} ج.م

💰 الإجمالي: ${total} ج.م

👤 الاسم: ${name}

📞 الموبايل: ${phone}

📍 المحافظة: ${gov}

🏡 العنوان: ${address}

💳 يرجى تحويل المبلغ إلى:

01002685845

(فودافون كاش أو InstaPay)

📸 ثم إرسال سكرين شوت التحويل

📱 ورقم الهاتف الذي تم التحويل منه

✅ لتأكيد الطلب وتجهيزه للشحن`;

window.open(
`https://wa.me/201033950845?text=${encodeURIComponent(text)}`,
"_blank"
);

}
</script>
